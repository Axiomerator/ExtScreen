[package]
name = "extscreen-common"
version = "1.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.16", features = ["derive"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
spake2 = "0.4"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
subtle = "2"

[dev-dependencies]
bincode = "1.3"
